name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired API or behavior and include a usage example where possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
