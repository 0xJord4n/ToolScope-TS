name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For vulnerabilities, stop here and follow the [private reporting instructions](https://github.com/0xJord4n/ToolScope-TS/security/policy).
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    attributes:
      label: ToolScope TS version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Integration
      options:
        - Core API
        - Vercel AI SDK
        - LangGraph.js
        - MCP
        - SQLite backend
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample or repository that demonstrates the issue. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include Bun or Node version, operating system, and relevant framework versions.
    validations:
      required: true
